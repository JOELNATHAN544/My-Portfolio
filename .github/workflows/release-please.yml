on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: Release Please & Deploy

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with: 
          release-type: node
          token: ${{ secrets.MY_PERSONAL_TOKEN }}
